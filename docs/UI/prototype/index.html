<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mile Terminal · UI 重构原型</title>
<!--
  一次性静态原型，对应 docs/UI/UI-REFACTOR.md。不联网、不依赖构建。
  数据全部是假的，所有「启动 / 停止」都只是模拟状态变化。
  字体：真实应用打包 Manrope；这里没有网络字体，标题回落到 Segoe UI Variable。
-->
<style>
:root, [data-theme='light'] {
  --canvas: #F6F7FB;
  --panel: #FFFFFF;
  --card: #FFFFFF;
  --raised: #EEF1F6;
  --sunken: #F1F3F8;
  --line: #E3E7EE;
  --line-strong: #CBD2DD;
  --ink-strong: #1B1F2E;
  --ink: #2B3142;
  --ink-muted: #4C5265;
  --ink-faint: #5F6678;
  --accent: #2563EB;
  --accent-hover: #1D4ED8;
  --accent-ink: #2563EB;
  --accent-soft: #E3ECFF;
  --live: #15803D;  --live-soft: #DCFCE7;
  --warn: #92400E;  --warn-soft: #FEF3C7;
  --fault: #B91C1C; --fault-soft: #FEE2E2;
  --dot-live: #16A34A; --dot-warn: #D97706; --dot-fault: #DC2626; --dot-idle: #A0A7B5;
  --shadow-1: 0 4px 14px rgb(20 28 48 / 0.07);
  --shadow-2: 0 8px 22px rgb(20 28 48 / 0.12);
  --shadow-3: 0 16px 40px rgb(20 28 48 / 0.16);
  --glass: rgb(246 247 251 / 0.85);
  --scrim: rgb(15 18 25 / 0.28);
  --term-bg: #10141C;
  --term-ink: #D7DEEA;
}
[data-theme='dark'] {
  --canvas: #0F1219;
  --panel: #151A23;
  --card: #151A23;
  --raised: #1B212C;
  --sunken: #121720;
  --line: #262E3B;
  --line-strong: #364152;
  --ink-strong: #F1F4F9;
  --ink: #E4E8F0;
  --ink-muted: #A3ACBC;
  --ink-faint: #8A94A6;
  --accent: #2563EB;
  --accent-hover: #3B74F0;
  --accent-ink: #7AA7FF;
  --accent-soft: rgb(37 99 235 / 0.18);
  --live: #4ADE80;  --live-soft: rgb(34 197 94 / 0.15);
  --warn: #FBBF24;  --warn-soft: rgb(245 158 11 / 0.15);
  --fault: #F87171; --fault-soft: rgb(239 68 68 / 0.15);
  --dot-live: #4ADE80; --dot-warn: #FBBF24; --dot-fault: #F87171; --dot-idle: #5B6576;
  --shadow-1: none; --shadow-2: none; --shadow-3: 0 16px 40px rgb(0 0 0 / 0.45);
  --glass: rgb(15 18 25 / 0.82);
  --scrim: rgb(0 0 0 / 0.5);
  --term-bg: #0B0E14;
  --term-ink: #D7DEEA;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', system-ui, sans-serif;
  font-size: 13px; line-height: 1.5; color: var(--ink); background: var(--canvas);
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
.theme-switching * { transition: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
.mono { font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, monospace; }
.display { font-family: 'Manrope', 'Segoe UI Variable Display', 'Segoe UI', 'Microsoft YaHei UI', sans-serif; }
.num { font-variant-numeric: tabular-nums; }
svg.ph { width: 16px; height: 16px; flex: none; fill: currentColor; }
svg.ph.lg { width: 20px; height: 20px; }

/* ── 外框 ─────────────────────────────────────────── */
.app { display: grid; grid-template-rows: 40px 1fr; height: 100vh; }
.titlebar {
  display: flex; align-items: center; gap: 12px; padding-left: 14px;
  background: var(--glass); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line);
  position: relative; z-index: 30;
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; color: var(--ink-strong); letter-spacing: -0.01em; }
.brand-mark {
  width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center;
  background: linear-gradient(135deg, #2563EB, #6E3FF3); color: #fff; font-size: 12px; font-weight: 800;
}
.search-trigger {
  margin: 0 auto; width: 360px; height: 30px; display: flex; align-items: center; gap: 8px;
  padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
  color: var(--ink-faint); transition: border-color 90ms, box-shadow 90ms;
}
.search-trigger:hover { border-color: var(--line-strong); }
.kbd {
  font-family: 'Cascadia Code', Consolas, monospace; font-size: 12px; color: var(--ink-muted);
  border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 6px; background: var(--raised);
}
.search-trigger .kbd { margin-left: auto; }
.tb-right { display: flex; align-items: center; height: 100%; }
.bell { position: relative; width: 36px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-muted); margin-right: 6px; }
.bell:hover { background: var(--raised); color: var(--ink-strong); }
.badge {
  position: absolute; top: 1px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
  background: var(--accent); color: #fff; font-size: 12px; line-height: 16px; font-weight: 700; text-align: center;
}
.badge.fault { background: var(--dot-fault); }
.chrome { width: 46px; height: 40px; display: grid; place-items: center; color: var(--ink-muted); }
.chrome:hover { background: var(--raised); color: var(--ink-strong); }
.chrome.close:hover { background: #C42B1C; color: #fff; }

.body { display: flex; min-height: 0; }
.nav {
  width: 184px; flex: none; display: flex; flex-direction: column; gap: 2px; padding: 12px 10px;
  border-right: 1px solid var(--line); background: var(--panel); transition: width 200ms cubic-bezier(.32,.72,.32,1);
  position: relative; overflow: hidden;
}
.nav.collapsed { width: 56px; }
.nav-item {
  position: relative; display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px;
  border-radius: 10px; color: var(--ink-muted); white-space: nowrap; font-weight: 600;
  transition: background-color 90ms, color 90ms, transform 70ms;
}
.nav-item:hover { background: var(--raised); color: var(--ink-strong); }
.nav-item[aria-current='page'] { background: var(--accent-soft); color: var(--accent-ink); }
.nav-item .label { transition: opacity 120ms; }
.nav.collapsed .nav-item .label, .nav.collapsed .nav-item .kbd { opacity: 0; pointer-events: none; }
.nav-item .kbd { margin-left: auto; font-size: 12px; }
.nav-sep { flex: 1; }
.nav-indicator {
  position: absolute; left: 0; width: 3px; height: 20px; border-radius: 0 3px 3px 0; background: var(--accent);
  transition: transform 200ms cubic-bezier(.34,1.56,.64,1);
}
.nav-tip {
  position: fixed; z-index: 60; background: var(--ink-strong); color: var(--canvas); padding: 4px 8px; border-radius: 8px;
  font-size: 12px; pointer-events: none; opacity: 0; transform: translateX(-4px); transition: opacity 120ms, transform 120ms;
}
.nav-tip.show { opacity: 1; transform: none; }

.main { flex: 1; min-width: 0; overflow-y: auto; container-type: inline-size; }
.main.flush { overflow: hidden; display: flex; flex-direction: column; }
.page { padding: 24px; display: flex; flex-direction: column; gap: 16px; min-height: 100%; }
.main.flush .page { min-height: 0; flex: 1; padding-bottom: 16px; }

.view-head { display: flex; align-items: flex-end; gap: 16px; }
.view-head h1 { font-size: 22px; font-weight: 700; color: var(--ink-strong); letter-spacing: -0.02em; line-height: 1.2; }
.view-head p { color: var(--ink-muted); margin-top: 2px; }
.view-head .actions { margin-left: auto; display: flex; gap: 8px; }

/* ── 控件 ─────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px;
  border-radius: 10px; font-weight: 600; white-space: nowrap; border: 1px solid transparent;
  transition: background-color 90ms, border-color 90ms, color 90ms, box-shadow 90ms, transform 200ms cubic-bezier(.34,1.56,.64,1);
}
.btn:active, .iconbtn:active, .nav-item:active { transform: scale(0.96); transition-duration: 70ms; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.secondary { background: var(--card); border-color: var(--line-strong); color: var(--ink-strong); }
.btn.secondary:hover { border-color: var(--ink-faint); }
.btn.ghost { color: var(--ink-muted); }
.btn.ghost:hover { background: var(--raised); color: var(--ink-strong); }
.btn.danger { background: var(--fault); color: #fff; }
[data-theme='dark'] .btn.danger { background: #DC2626; }
.btn.stop { background: var(--card); border-color: var(--line-strong); color: var(--ink-strong); }
.btn.stop:hover { border-color: var(--fault); color: var(--fault); }
.btn.sm { height: 28px; padding: 0 10px; }
.btn:disabled { background: var(--raised); border-color: var(--line-strong); color: var(--ink-faint); cursor: not-allowed; transform: none; }
.btn.failed { background: var(--fault-soft); border-color: var(--fault); color: var(--fault); animation: shake 320ms; }
@keyframes shake { 0%,100% { translate: 0 } 20% { translate: -3px } 40% { translate: 3px } 60% { translate: -2px } 80% { translate: 2px } }

.iconbtn {
  width: 28px; height: 28px; border-radius: 8px; display: inline-grid; place-items: center; color: var(--ink-muted);
  transition: background-color 90ms, color 90ms, transform 200ms cubic-bezier(.34,1.56,.64,1);
}
.iconbtn:hover { background: var(--raised); color: var(--ink-strong); }
.iconbtn.on { color: var(--live); }

.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--raised); border-radius: 10px; }
.seg button { height: 28px; padding: 0 12px; border-radius: 8px; color: var(--ink-muted); font-weight: 600; transition: background-color 90ms, color 90ms; }
.seg button:hover { color: var(--ink-strong); }
.seg button[aria-pressed='true'] { background: var(--card); color: var(--ink-strong); box-shadow: 0 1px 3px rgb(20 28 48 / 0.1); }
[data-theme='dark'] .seg button[aria-pressed='true'] { background: var(--line-strong); }
.seg .count { color: var(--ink-faint); font-weight: 500; margin-left: 4px; }

.input {
  height: 32px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--card); width: 100%;
  transition: border-color 90ms, box-shadow 90ms;
}
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input:disabled { background: var(--sunken); color: var(--ink-muted); }
.search-box { position: relative; width: 240px; }
.search-box svg { position: absolute; left: 10px; top: 8px; color: var(--ink-faint); }
.search-box .input { padding-left: 32px; }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.live { background: var(--live-soft); color: var(--live); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.fault { background: var(--fault-soft); color: var(--fault); }
.pill.idle { background: var(--raised); color: var(--ink-muted); }
.pill.info { background: var(--accent-soft); color: var(--accent-ink); }
.env { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 700; font-family: 'Cascadia Code', Consolas, monospace; }
.env.dev { background: var(--raised); color: var(--ink-muted); }
.env.sandbox { background: var(--warn-soft); color: var(--warn); }
.env.prod { background: var(--fault-soft); color: var(--fault); }
.env svg { width: 12px; height: 12px; }

.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--dot-idle); }
.dot.live { background: var(--dot-live); animation: breathe 2s ease-in-out infinite; }
.dot.warn { background: var(--dot-warn); animation: breathe 0.9s ease-in-out infinite; }
.dot.fault { background: var(--dot-fault); }
.dot.fault.flash { animation: flash 600ms 1; }
@keyframes breathe { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 0%, transparent); opacity: 1 } 50% { opacity: .55 } }
@keyframes flash { 0%,50% { opacity: .2 } 25%,100% { opacity: 1 } }

/* ── 磁贴与网格 ───────────────────────────────────── */
.tile {
  background: var(--card); border-radius: 16px; box-shadow: var(--shadow-1); border: 1px solid transparent;
  transition: box-shadow 90ms, transform 90ms, border-color 90ms;
}
[data-theme='dark'] .tile { border-color: var(--line); }
.tile.hoverable:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); }
.tile.tone-live { border-color: color-mix(in srgb, var(--dot-live) 55%, transparent); }
.tile.tone-fault { border-color: var(--dot-fault); }
.tile-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
.tile-head h2 { font-size: 15px; font-weight: 700; color: var(--ink-strong); }
.tile-head .sub { color: var(--ink-faint); font-size: 12px; }
.tile-head .right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.tile-body { padding: 0 16px 16px; }

.bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; grid-auto-rows: minmax(120px, auto); }
.span-2 { grid-column: span 2; } .span-3 { grid-column: span 3; } .span-4 { grid-column: 1 / -1; } .row-2 { grid-row: span 2; }
@container (max-width: 56rem) { .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); } .span-3, .span-4 { grid-column: 1 / -1; } }

.kpi { padding: 16px; display: flex; flex-direction: column; gap: 4px; cursor: default; }
.kpi .k { display: flex; align-items: center; gap: 8px; color: var(--ink-faint); font-weight: 600; font-size: 12px; }
.kpi .k .ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); }
.kpi .v { font-size: 30px; font-weight: 800; color: var(--ink-strong); letter-spacing: -0.03em; line-height: 1.15; margin-top: 6px; }
.kpi .v small { font-size: 15px; font-weight: 700; color: var(--ink-faint); margin-left: 2px; }
.kpi .hint { color: var(--ink-muted); font-size: 12px; margin-top: auto; }
.kpi.warn .k .ico { background: var(--warn-soft); color: var(--warn); }
.spark { width: 100%; height: 28px; margin-top: 4px; }
.spark path { fill: none; stroke: var(--accent-ink); stroke-width: 1.5; }
.spark .area { fill: var(--accent-soft); stroke: none; }

/* ── 服务页 ───────────────────────────────────────── */
.toolbar { display: flex; align-items: center; gap: 12px; }
.toolbar .search-box { margin-left: auto; }
.svc-split { display: flex; gap: 0; align-items: flex-start; flex: 1; min-height: 0; }
.svc-list { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-content: start; }
.svc-split.open .svc-list { flex: none; grid-template-columns: minmax(0, 1fr); overflow-y: auto; max-height: calc(100vh - 40px - 166px); padding: 2px 4px 2px 2px; }
.resizer { width: 16px; flex: none; align-self: stretch; cursor: col-resize; position: relative; }
.resizer::after { content: ''; position: absolute; left: 7px; top: 30%; height: 40%; width: 2px; border-radius: 2px; background: var(--line-strong); opacity: 0; transition: opacity 90ms; }
.resizer:hover::after, .resizer.drag::after { opacity: 1; }

.group-tile .tile-head { padding-bottom: 8px; }
.group-tile .count { color: var(--ink-muted); font-weight: 600; font-size: 12px; }
.rows { padding: 0 6px 8px; display: flex; flex-direction: column; position: relative; }
.row {
  position: relative; display: grid; grid-template-columns: 8px 28px minmax(0, 1fr) auto auto 28px; align-items: center; gap: 10px;
  height: 44px; padding: 0 8px 0 12px; border-radius: 10px; cursor: pointer; transition: background-color 90ms;
}
.row:hover { background: var(--sunken); }
.row[aria-selected='true'] { background: var(--accent-soft); }
.row .name { font-weight: 600; color: var(--ink-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .name small { display: block; font-weight: 400; color: var(--ink-faint); font-size: 12px; }
.row .port { color: var(--ink-muted); font-size: 12px; }
.row-indicator {
  position: absolute; left: 0; width: 3px; height: 24px; border-radius: 0 3px 3px 0; background: var(--accent);
  transition: transform 200ms cubic-bezier(.34,1.56,.64,1), opacity 120ms;
}
.glyph { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff; }

.detail { flex: 1; min-width: 0; display: flex; flex-direction: column; max-height: calc(100vh - 40px - 166px); overflow: hidden; }
.goal:disabled { opacity: 1; color: var(--ink-faint); cursor: not-allowed; transform: none; box-shadow: none; border-color: var(--line); }
.menu button:disabled { color: var(--ink-faint); background: none; cursor: not-allowed; }
.table tr.hi td { background: var(--accent-soft); transition: background-color 600ms; }
.resizer:focus-visible::after { opacity: 1; }
.detail.enter { animation: slide-in 220ms cubic-bezier(.32,.72,.32,1); }
.row.cursor, .tile-head.cursor { box-shadow: inset 0 0 0 2px var(--accent); border-radius: 10px; }
.detail.max { position: fixed; z-index: 20; top: 56px; bottom: 16px; right: 16px; max-height: none; box-shadow: var(--shadow-3); }
@keyframes slide-in { from { opacity: 0; transform: translateX(12px) } }
.detail-head { display: flex; align-items: center; gap: 12px; padding: 16px 16px 12px; }
.detail-head h2 { font-size: 18px; font-weight: 700; color: var(--ink-strong); letter-spacing: -0.01em; }
.detail-head .meta { display: flex; align-items: center; gap: 8px; margin-top: 2px; color: var(--ink-muted); font-size: 12px; }
.detail-head .right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); position: relative; }
.tab { height: 38px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-muted); font-weight: 600; border-radius: 8px 8px 0 0; }
.tab:hover { color: var(--ink-strong); }
.tab[aria-selected='true'] { color: var(--accent-ink); }
.tab-ink { position: absolute; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; transition: transform 200ms cubic-bezier(.34,1.56,.64,1), width 200ms cubic-bezier(.34,1.56,.64,1); }
.detail-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }
.kv { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px 12px; align-items: center; }
.kv dt { color: var(--ink-faint); font-size: 12px; font-weight: 600; }
.kv dd { color: var(--ink-strong); min-width: 0; display: flex; align-items: center; gap: 6px; }
.kv dd .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.mini { background: var(--sunken); border-radius: 12px; padding: 12px; }
.mini .k { color: var(--ink-faint); font-size: 12px; font-weight: 600; }
.mini .v { font-size: 20px; font-weight: 800; color: var(--ink-strong); letter-spacing: -0.02em; }

.term { background: var(--term-bg); color: var(--term-ink); border-radius: 12px; padding: 12px 14px; font-family: 'Cascadia Code', Consolas, monospace; font-size: 12.5px; line-height: 1.6; min-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
.term .sep { color: #8A94A6; border-top: 1px dashed #364152; margin: 8px 0; padding-top: 6px; display: block; }
.term .err { color: #FCA5A5; } .term .ok { color: #86EFAC; } .term .dim { color: #8A94A6; } .term .warnl { color: #FCD34D; }
.term-fill { flex: 1; min-height: 0; }

.check { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-radius: 12px; background: var(--sunken); }
.check + .check { margin-top: 8px; }
.check .ico { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.check.ok .ico { background: var(--live-soft); color: var(--live); }
.check.fail .ico { background: var(--fault-soft); color: var(--fault); }
.check.warn .ico { background: var(--warn-soft); color: var(--warn); }
.check.info .ico { background: var(--accent-soft); color: var(--accent-ink); }
.check .t { font-weight: 600; color: var(--ink-strong); }
.check .d { color: var(--ink-muted); font-size: 12px; }
.check .act { margin-left: auto; align-self: center; }

.form-sec { border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.form-sec + .form-sec { margin-top: 12px; }
.form-sec > summary, .form-sec > .sec-t { font-weight: 700; color: var(--ink-strong); cursor: pointer; display: flex; align-items: center; gap: 6px; list-style: none; }
.form-sec > summary::-webkit-details-marker { display: none; }
.form-sec > summary svg { transition: transform 200ms cubic-bezier(.34,1.56,.64,1); }
.form-sec[open] > summary svg { transform: rotate(90deg); }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-muted); display: flex; align-items: center; gap: 4px; }
.field .lock { color: var(--ink-faint); font-weight: 500; display: inline-flex; align-items: center; gap: 3px; margin-left: auto; }
.field .lock svg { width: 12px; height: 12px; }
.savebar {
